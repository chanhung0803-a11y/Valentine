<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    color:#fff;
}

.hidden{ display:none; }

/* TIM RƠI */
.fall-heart{
    position:fixed;
    top:-10px;
    font-size:18px;
    animation:fall linear forwards;
}
@keyframes fall{
    to{ transform:translateY(100vh); opacity:0; }
}

/* BAO THƯ */
.envelope{
    width:340px;
    height:220px;
    background:linear-gradient(145deg,#fff,#ffe6ec);
    position:relative;
    border-radius:15px;
    cursor:pointer;
    box-shadow:0 15px 30px rgba(0,0,0,0.3);
    transition:0.5s;
}
.envelope:hover{ transform:scale(1.05); }

.envelope:before{
    content:"";
    position:absolute;
    top:-110px;
    left:0;
    border-left:170px solid transparent;
    border-right:170px solid transparent;
    border-bottom:110px solid #fff;
}
.envelope-text{
    position:absolute;
    top:40%;
    width:100%;
    color:#ff4b7d;
    font-size:20px;
    font-weight:bold;
}

/* LÁ THƯ */
.letter{
    background:white;
    color:#ff4b7d;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* TRANG TIM */
#heartContainer{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
    max-width:500px;
}
.heart{
    font-size:45px;
    cursor:pointer;
    transition:0.3s;
}
.heart:hover{ transform:scale(1.2); }

.message-box{
    margin-top:25px;
    background:white;
    color:#ff4b7d;
    padding:15px 20px;
    border-radius:20px;
    min-height:60px;
    width:320px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

/* TRANG CÂU HỎI */
.final{ max-width:600px; }

button{
    padding:10px 20px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    font-size:18px;
}
</style>
</head>
<body>

<script>
/* TIM RƠI */
function falling(){
    const h=document.createElement("div");
    h.innerHTML="💖";
    h.className="fall-heart";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(4+Math.random()*3)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),7000);
}
setInterval(falling,500);
</script>

<!-- BAO THƯ -->
<div id="start">
    <div class="envelope" onclick="openLetter()">
        <div class="envelope-text">Mở thư nè iuu 💌</div>
    </div>
</div>

<!-- LÁ THƯ -->
<div id="letter" class="hidden">
    <div class="letter">
        <h2>Happy Valentine 14/2 💖</h2>
        <h3>Nguyễn Hà Thảo Ngọc</h3>
        <button onclick="nextPage()">Next ➜</button>
    </div>
</div>

<!-- TRANG TIM -->
<div id="heartsPage" class="hidden">
    <div id="heartContainer"></div>
    <div class="message-box" id="message">Bấm vào trái tim đi nè 💕</div>
</div>

<!-- TRANG CÂU HỎI -->
<div id="questionPage" class="hidden final">
    <h2>Ngọc có iuu Hưng hongg? 🥺💖</h2>
    <div style="font-size:50px;margin:10px 0;">🐱 💕 🐱</div>

    <div style="margin-top:20px;">
        <button id="yesBtn" onclick="sayYes()" 
        style="background:#28a745;color:white;transition:0.3s;">
        CÓ 💚
        </button>

        <button id="noBtn" onclick="sayNo()" 
        style="margin-left:15px;transition:0.3s;">
        KHÔNG 🙈
        </button>
    </div>
</div>

<script>
function openLetter(){
    document.getElementById("start").classList.add("hidden");
    document.getElementById("letter").classList.remove("hidden");
}

function nextPage(){
    document.getElementById("letter").classList.add("hidden");
    document.getElementById("heartsPage").classList.remove("hidden");
    createHearts();
}

const wishes=[
"🌸 14/2 vui vẻ nhoaaa, cảm ơn vì đã ở bên tui 💕",
"🌷 Valentine này mong bạn luôn cười nhiều ✨", 
"💞 mong hai đứa mình có thể bên nhau thật lâu, thật thật lâu nhé.", 
"🌹 Chúc bạn một ngày thật ấm áp và nhiều yêu thương.", 
"🌼 Dù không nói nhiều, nhưng tui thương bạn lắm đó."
];

let count=0;

function createHearts(){
    const container=document.getElementById("heartContainer");
    wishes.forEach((wish)=>{
        let heart=document.createElement("div");
        heart.className="heart";
        heart.innerHTML="❤️";
        heart.style.color=`hsl(${Math.random()*360},80%,60%)`;
        heart.onclick=function(){
            document.getElementById("message").innerText=wish;
            heart.remove();
            count++;
            if(count===wishes.length){
                setTimeout(()=>{
                    document.getElementById("heartsPage").classList.add("hidden");
                    document.getElementById("questionPage").classList.remove("hidden");
                },1200);
            }
        };
        container.appendChild(heart);
    });
}

/* CÂU HỎI */
let noCount=0;
let yesScale=1;
let noScale=1;

function sayNo(){
    noCount++;
    noScale-=0.2;
    yesScale+=0.3;

    document.getElementById("noBtn").style.transform=`scale(${noScale})`;
    document.getElementById("yesBtn").style.transform=`scale(${yesScale})`;

    if(noCount>=4){
        document.getElementById("noBtn").style.display="none";
        document.getElementById("yesBtn").style.transform="scale(3)";
    }
}

function sayYes(){
    document.getElementById("questionPage").classList.add("hidden");
    showBeautifulLetter();
}

/* LÁ THƯ ĐẸP */
function showBeautifulLetter(){
    const div=document.createElement("div");
    div.innerHTML=`
        <div style="position:relative;width:420px;margin:auto;">
            <div style="
                background:white;
                padding:40px;
                border-radius:20px;
                box-shadow:0 10px 30px rgba(0,0,0,0.3);
                position:relative;
                color:#ff4b7d;
            ">
                <div style="
                    position:absolute;
                    top:-60px;
                    left:50%;
                    transform:translateX(-50%);
                    width:0;
                    height:0;
                    border-left:60px solid transparent;
                    border-right:60px solid transparent;
                    border-top:60px solid white;
                "></div>

                <div style="
                    position:absolute;
                    top:-30px;
                    left:50%;
                    transform:translateX(-50%);
                    font-size:40px;
                ">💖</div>

                <h2>Hưng hạnh phúc lắm 💕</h2>
                <p>
                Cảm ơn vì đã chọn Hưng.  
                Từ giờ về sau, chỉ cần Ngọc ở đó,  
                mọi thứ đều trở nên đặc biệt 💗
                </p>

                <br>
                <button onclick="location.reload()">Xem lại từ đầu ✨</button>
            </div>
        </div>
    `;
    document.body.appendChild(div);
}
</script>

</body>
</html>

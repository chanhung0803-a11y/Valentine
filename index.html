<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    color:#fff;
}

.fall-heart{
    position:fixed;
    top:-10px;
    font-size:18px;
    animation:fall linear forwards;
}
@keyframes fall{
    to{ transform:translateY(100vh); opacity:0; }
}

/* Ẩn */
.hidden{ display:none; }

/* BAO THƯ */
.envelope{
    width:320px;
    height:200px;
    background:linear-gradient(145deg,#fff,#ffe6ec);
    position:relative;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 15px 30px rgba(0,0,0,0.2);
    transition:0.5s;
}
.envelope:hover{ transform:scale(1.05); }

.envelope:before{
    content:"";
    position:absolute;
    top:-100px;
    left:0;
    width:0;
    height:0;
    border-left:160px solid transparent;
    border-right:160px solid transparent;
    border-bottom:100px solid #fff;
}
.envelope-text{
    position:absolute;
    top:40%;
    width:100%;
    color:#ff4b7d;
    font-size:20px;
    font-weight:bold;
}

/* LÁ THƯ */
.letter{
    background:white;
    color:#ff4b7d;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* TRANG TIM */
#heart
